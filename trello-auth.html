<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trello Authorization</title><style>body{font-family:Arial,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f1ea;color:#17324d}.box{max-width:520px;padding:28px;border:1px solid #d9d4ca;border-radius:18px;background:#fff;text-align:center}p{color:#66717c}</style></head><body><div class="box"><h1>Connecting Trello…</h1><p id="status">Returning authorization to Nicole's Operations Suite.</p></div><script>
(()=>{const params=new URLSearchParams(location.hash.slice(1));const token=params.get('token')||'';const error=params.get('error')||'';const status=document.getElementById('status');if(window.opener){window.opener.postMessage({type:'nah:trello-auth',token,error},location.origin);status.textContent=error?`Authorization failed: ${error}`:'Authorization received. This window can close.';setTimeout(()=>window.close(),700)}else status.textContent='Return to the Operations Suite and try connecting again.'})();
</script></body></html>
